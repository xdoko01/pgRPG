[project]
name = "pgrpg"
version = "0.1.0"
description = "Pygame-based ECS game engine."
authors = [
    { name = "xdoko01" }
]
readme = "README.md"
license = "MIT"
# 3.9 is the real floor: str.removeprefix (used in functions/translate.py) is 3.9+.
requires-python = ">=3.9"
dependencies = [
    "pygame-ce",
    "pygame-gui>=0.6.4",
    "pytmx",
    "pgbitmapfont>=0.1.5",
    "pgconsole>=0.1.1",
    "psutil",
    "pyyaml",
    "toml"
]

[project.optional-dependencies]
# Install with: pip install -e .[test]
# jsonschema validates the authoring schemas under example_game/core/schemas/
# against the game resources. Tests that need it skip when it is absent, so the
# suite still runs on a bare install.
test = [
    "pytest",
    "jsonschema>=4.18"
]

[tool.setuptools.packages.find]
include = ["pgrpg*"]
exclude = ["experiments*", "example_game*"]

[project.urls]
Homepage = "https://github.com/xdoko01/pgrpg"
Issues = "https://github.com/xdoko01/pgrpg/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"